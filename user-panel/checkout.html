<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - ShopEase</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%); min-height: 100vh; }

        .payment-page {
            max-width: 450px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .payment-header {
            text-align: center;
            padding: 30px 0 20px;
            color: white;
        }

        .payment-header h1 { font-size: 1.5rem; }
        .payment-header p { font-size: 0.9rem; opacity: 0.9; margin-top: 5px; }

        .card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 15px;
        }

        .amount-section {
            text-align: center;
            padding: 10px 0 20px;
        }

        .amount-section .label { font-size: 0.9rem; color: #636e72; }
        .amount-section .amount { font-size: 2.8rem; font-weight: 800; color: #2d3436; margin: 5px 0; }

        .qr-section {
            text-align: center;
            padding: 20px 0;
        }

        .qr-section h3 { font-size: 1rem; color: #2d3436; margin-bottom: 15px; }

        #qrcode {
            display: inline-block;
            padding: 15px;
            background: white;
            border: 3px solid #6c5ce7;
            border-radius: 16px;
        }

        #qrcode img { display: block; }

        .upi-details {
            margin-top: 15px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .upi-details p { font-size: 0.85rem; color: #636e72; }
        .upi-details .upi-id { font-weight: 700; color: #6c5ce7; font-size: 1rem; }

        .timer-section {
            text-align: center;
            padding: 15px 0;
        }

        .timer-section .label { font-size: 0.85rem; color: #636e72; margin-bottom: 8px; }

        .timer {
            font-size: 3rem;
            font-weight: 800;
            color: #d63031;
            font-variant-numeric: tabular-nums;
        }

        .timer.warning { color: #e17055; }
        .timer.danger { color: #d63031; animation: pulse 0.5s infinite; }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        .timer-bar {
            width: 100%;
            height: 8px;
            background: #dfe6e9;
            border-radius: 4px;
            margin-top: 12px;
            overflow: hidden;
        }

        .timer-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #00b894, #6c5ce7);
            border-radius: 4px;
            transition: width 1s linear;
        }

        .order-info {
            padding: 15px 0;
            border-top: 1px dashed #dfe6e9;
        }

        .order-info .item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 0.9rem;
            color: #636e72;
        }

        .order-info .total {
            display: flex;
            justify-content: space-between;
            padding: 10px 0 0;
            font-size: 1.1rem;
            font-weight: 700;
            color: #2d3436;
            border-top: 2px solid #6c5ce7;
            margin-top: 8px;
        }

        .check-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #00b894, #55efc4);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .check-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0, 184, 148, 0.4); }

        .back-link {
            text-align: center;
            padding: 15px 0;
            color: rgba(255,255,255,0.8);
            font-size: 0.9rem;
            cursor: pointer;
        }

        .back-link:hover { color: white; }

        /* Success Popup */
        .popup-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .popup-overlay.show { display: flex; }

        .popup {
            background: white;
            border-radius: 24px;
            padding: 50px 40px;
            text-align: center;
            max-width: 350px;
            width: 90%;
            animation: popIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .popup-icon {
            width: 100px; height: 100px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
        }

        .popup-icon.success { background: linear-gradient(135deg, #00b894, #55efc4); }
        .popup-icon.failed { background: linear-gradient(135deg, #d63031, #ff7675); }

        .popup-icon i { font-size: 3rem; color: white; }

        .popup h2 { font-size: 1.6rem; margin-bottom: 10px; color: #2d3436; }
        .popup p { color: #636e72; margin-bottom: 5px; }
        .popup .auto-text { font-size: 0.85rem; color: #b2bec3; margin-top: 20px; }

        @keyframes popIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .spinner {
            display: inline-block;
            width: 22px; height: 22px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 480px) {
            .payment-page { padding: 15px; }
            .amount-section .amount { font-size: 2.2rem; }
            .timer { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

<div class="payment-page">
    <div class="payment-header">
        <h1><i class="fas fa-lock"></i> Secure Payment</h1>
        <p>Scan QR code to complete payment</p>
    </div>

    <!-- Amount Card -->
    <div class="card">
        <div class="amount-section">
            <p class="label">Total Amount to Pay</p>
            <div class="amount" id="payAmount">₹0</div>
        </div>
    </div>

    <!-- QR Code Card -->
    <div class="card">
        <div class="qr-section">
            <h3><i class="fas fa-qrcode"></i> Scan QR Code</h3>
            <div id="qrcode"></div>
            <div class="upi-details">
                <p>UPI ID</p>
                <p class="upi-id">8690473929@ybl</p>
            </div>
        </div>
    </div>

    <!-- Timer Card -->
    <div class="card">
        <div class="timer-section">
            <p class="label"><i class="fas fa-clock"></i> Time Remaining</p>
            <div class="timer" id="timer">10:00</div>
            <div class="timer-bar">
                <div class="timer-bar-fill" id="timerBar" style="width:100%"></div>
            </div>
        </div>
    </div>

    <!-- Order Info Card -->
    <div class="card">
        <div class="order-info" id="orderInfo">
            <!-- Items will be loaded here -->
        </div>
    </div>

    <!-- Check Payment Button -->
    <button class="check-btn" id="checkBtn" onclick="checkPayment()">
        <i class="fas fa-check-circle"></i> Payment Done
    </button>

    <div class="back-link" onclick="goBack()">
        <i class="fas fa-arrow-left"></i> Cancel Payment
    </div>
</div>

<!-- Success Popup -->
<div class="popup-overlay" id="successPopup">
    <div class="popup">
        <div class="popup-icon success">
            <i class="fas fa-check"></i>
        </div>
        <h2>Payment Successful!</h2>
        <p>Thank you for your order</p>
        <p class="auto-text">Redirecting in <span id="countdown">5</span>s...</p>
    </div>
</div>

<script>
    var orderData = JSON.parse(localStorage.getItem('pendingOrder'));
    var totalTime = 600;
    var timerInterval;

    document.addEventListener('DOMContentLoaded', function() {
        if (!orderData) {
            window.location.href = '/';
            return;
        }

        // Set amount
        document.getElementById('payAmount').textContent = '\u20B9' + orderData.total.toLocaleString();

        // Show order items
        var html = '';
        orderData.items.forEach(function(item) {
            html += '<div class="item"><span>' + item.name + ' x' + item.qty + '</span><span>\u20B9' + (item.price * item.qty) + '</span></div>';
        });
        html += '<div class="total"><span>Total</span><span>\u20B9' + orderData.total.toLocaleString() + '</span></div>';
        document.getElementById('orderInfo').innerHTML = html;

        // Generate QR
        generateQR();

        // Start timer
        startTimer();
    });

    function generateQR() {
        var upiUrl = 'upi://pay?pa=8690473929@ybl&pn=ShopEase&am=' + orderData.total + '&cu=INR&tn=Payment';
        new QRCode(document.getElementById('qrcode'), {
            text: upiUrl,
            width: 200,
            height: 200,
            colorDark: '#2d3436',
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.H
        });
    }

    function startTimer() {
        timerInterval = setInterval(function() {
            totalTime--;
            var m = Math.floor(totalTime / 60);
            var s = totalTime % 60;
            document.getElementById('timer').textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;

            var pct = (totalTime / 600) * 100;
            document.getElementById('timerBar').style.width = pct + '%';

            var timerEl = document.getElementById('timer');
            if (totalTime <= 60) {
                timerEl.className = 'timer danger';
            } else if (totalTime <= 180) {
                timerEl.className = 'timer warning';
            }

            if (totalTime <= 0) {
                clearInterval(timerInterval);
                alert('Time expired! Please try again.');
                goBack();
            }
        }, 1000);
    }

    function checkPayment() {
        var btn = document.getElementById('checkBtn');
        btn.innerHTML = '<span class="spinner"></span> Checking...';
        btn.disabled = true;

        // Save order and show success
        saveOrder();

        setTimeout(function() {
            showSuccess();
        }, 1500);
    }

    function showSuccess() {
        clearInterval(timerInterval);
        document.getElementById('successPopup').classList.add('show');

        var count = 5;
        var el = document.getElementById('countdown');
        var interval = setInterval(function() {
            count--;
            el.textContent = count;
            if (count <= 0) {
                clearInterval(interval);
                localStorage.removeItem('pendingOrder');
                window.location.href = '/';
            }
        }, 1000);
    }

    function saveOrder() {
        if (!orderData) return;
        try {
            db.collection('orders').add({
                userId: orderData.userId || 'guest',
                userName: orderData.userName || 'Guest',
                userEmail: orderData.userEmail || '',
                items: orderData.items,
                total: orderData.total,
                status: 'confirmed',
                paymentMethod: 'UPI QR',
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
        } catch(e) {}
    }

    function goBack() {
        clearInterval(timerInterval);
        window.location.href = '/';
    }
</script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
</body>
</html>
