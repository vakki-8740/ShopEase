<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - ShopEase</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%); min-height: 100vh; }

        .payment-page {
            max-width: 450px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .payment-header {
            text-align: center;
            padding: 30px 0 20px;
            color: white;
        }

        .payment-header h1 { font-size: 1.5rem; }
        .payment-header p { font-size: 0.9rem; opacity: 0.9; margin-top: 5px; }

        .card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 15px;
        }

        .amount-section {
            text-align: center;
            padding: 10px 0 20px;
        }

        .amount-section .label { font-size: 0.9rem; color: #636e72; }
        .amount-section .amount { font-size: 2.8rem; font-weight: 800; color: #2d3436; margin: 5px 0; }

        .order-info .item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 0.9rem;
            color: #636e72;
            border-bottom: 1px solid #f1f2f6;
        }

        .order-info .total {
            display: flex;
            justify-content: space-between;
            padding: 12px 0 0;
            font-size: 1.1rem;
            font-weight: 700;
            color: #2d3436;
        }

        .pay-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #00b894, #55efc4);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1.15rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .pay-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0, 184, 148, 0.4); }
        .pay-btn:disabled { background: #b2bec3; cursor: not-allowed; transform: none; }

        .secure {
            text-align: center;
            padding: 15px 0;
            color: rgba(255,255,255,0.8);
            font-size: 0.85rem;
        }

        .secure i { color: #00b894; }

        .back-link {
            text-align: center;
            padding: 10px 0;
            color: rgba(255,255,255,0.7);
            font-size: 0.9rem;
            cursor: pointer;
        }

        .back-link:hover { color: white; }

        /* PayU Form */
        #payuForm { display: none; }

        /* Success Popup */
        .popup-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .popup-overlay.show { display: flex; }

        .popup {
            background: white;
            border-radius: 24px;
            padding: 50px 40px;
            text-align: center;
            max-width: 350px;
            width: 90%;
            animation: popIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .popup-icon {
            width: 100px; height: 100px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
        }

        .popup-icon.success { background: linear-gradient(135deg, #00b894, #55efc4); }
        .popup-icon.failed { background: linear-gradient(135deg, #d63031, #ff7675); }

        .popup-icon i { font-size: 3rem; color: white; }

        .popup h2 { font-size: 1.6rem; margin-bottom: 10px; color: #2d3436; }
        .popup p { color: #636e72; margin-bottom: 5px; }
        .popup .auto-text { font-size: 0.85rem; color: #b2bec3; margin-top: 20px; }

        @keyframes popIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .spinner {
            display: inline-block;
            width: 22px; height: 22px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 480px) {
            .payment-page { padding: 15px; }
            .amount-section .amount { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

<div class="payment-page">
    <div class="payment-header">
        <h1><i class="fas fa-lock"></i> Secure Checkout</h1>
        <p>Complete your payment via PayU</p>
    </div>

    <!-- Amount Card -->
    <div class="card">
        <div class="amount-section">
            <p class="label">Total Amount</p>
            <div class="amount" id="payAmount">₹0</div>
        </div>
    </div>

    <!-- Order Info Card -->
    <div class="card">
        <div class="order-info" id="orderInfo"></div>
    </div>

    <!-- Pay Button -->
    <button class="pay-btn" id="payBtn" onclick="initPayment()">
        <i class="fas fa-shield-alt"></i> Pay Now via PayU
    </button>

    <div class="secure">
        <i class="fas fa-lock"></i> 100% Secure Payment by PayU
    </div>

    <div class="back-link" onclick="goBack()">
        <i class="fas fa-arrow-left"></i> Cancel
    </div>
</div>

<!-- PayU Form (Hidden) -->
<form id="payuForm" method="POST" action="https://sandboxsecure.payu.in/_payment">
    <input type="hidden" name="key" id="payuKey">
    <input type="hidden" name="txnid" id="payuTxnid">
    <input type="hidden" name="amount" id="payuAmount">
    <input type="hidden" name="productinfo" id="payuProductinfo">
    <input type="hidden" name="firstname" id="payuFirstname">
    <input type="hidden" name="email" id="payuEmail">
    <input type="hidden" name="phone" id="payuPhone">
    <input type="hidden" name="surl" id="payuSurl">
    <input type="hidden" name="furl" id="payuFurl">
    <input type="hidden" name="hash" id="payuHash">
    <input type="hidden" name="udf1" id="payuUdf1">
</form>

<!-- Success Popup -->
<div class="popup-overlay" id="successPopup">
    <div class="popup">
        <div class="popup-icon success">
            <i class="fas fa-check"></i>
        </div>
        <h2>Payment Successful!</h2>
        <p>Your order has been confirmed</p>
        <p class="auto-text">Redirecting in <span id="countdown">5</span>s...</p>
    </div>
</div>

<!-- Failed Popup -->
<div class="popup-overlay" id="failedPopup">
    <div class="popup">
        <div class="popup-icon failed">
            <i class="fas fa-times"></i>
        </div>
        <h2 style="color:#d63031">Payment Failed!</h2>
        <p>Your payment was not completed</p>
        <button onclick="retryPayment()" style="margin-top:20px;padding:12px 30px;background:#6c5ce7;color:white;border:none;border-radius:10px;font-weight:700;cursor:pointer;">
            Try Again
        </button>
        <br>
        <button onclick="goBack()" style="margin-top:10px;padding:10px 20px;background:transparent;color:#636e72;border:2px solid #dfe6e9;border-radius:10px;font-weight:600;cursor:pointer;">
            Go Back
        </button>
    </div>
</div>

<script>
    var PAYU_KEY = 'SkDGA0';
    var PAYU_SALT = 'q3t0z8uAUX3ZEv4ecMWmjRxmOBwUKqjc';
    var orderData = JSON.parse(localStorage.getItem('pendingOrder'));

    // Check if returning from PayU
    window.onload = function() {
        var params = new URLSearchParams(window.location.search);
        var status = params.get('status');
        if (status === 'success') {
            showSuccess();
        } else if (status === 'failed') {
            document.getElementById('failedPopup').classList.add('show');
        }
    };

    // Initialize page
    document.addEventListener('DOMContentLoaded', function() {
        // If already showing success/failed from URL params, skip
        var params = new URLSearchParams(window.location.search);
        if (params.get('status')) return;

        if (!orderData) {
            window.location.href = '/';
            return;
        }

        document.getElementById('payAmount').textContent = '\u20B9' + orderData.total.toLocaleString();

        var html = '';
        orderData.items.forEach(function(item) {
            html += '<div class="item"><span>' + item.name + ' x' + item.qty + '</span><span>\u20B9' + (item.price * item.qty) + '</span></div>';
        });
        html += '<div class="total"><span>Total</span><span>\u20B9' + orderData.total.toLocaleString() + '</span></div>';
        document.getElementById('orderInfo').innerHTML = html;
    });

    function generateTxnId() {
        return 'txn' + Date.now() + Math.random().toString(36).substr(2, 6);
    }

    // Init PayU Payment
    async function initPayment() {
        var btn = document.getElementById('payBtn');
        btn.innerHTML = '<span class="spinner"></span> Redirecting to PayU...';
        btn.disabled = true;

        var txnid = generateTxnId();
        var productinfo = orderData.items.map(function(i) { return i.name; }).join(', ');
        var firstname = orderData.userName || 'Guest';
        var email = orderData.userEmail || 'test@example.com';
        var phone = '9999999999';
        var currentUrl = window.location.origin + window.location.pathname;
        var surl = currentUrl + '?status=success&txnid=' + txnid;
        var furl = currentUrl + '?status=failed&txnid=' + txnid;

        try {
            var response = await fetch('/api/create-payment', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    key: PAYU_KEY,
                    salt: PAYU_SALT,
                    txnid: txnid,
                    amount: orderData.total,
                    productinfo: productinfo,
                    firstname: firstname,
                    email: email,
                    phone: phone,
                    surl: surl,
                    furl: furl,
                    udf1: orderData.userId || 'guest'
                })
            });

            var data = await response.json();

            if (data.success) {
                document.getElementById('payuKey').value = PAYU_KEY;
                document.getElementById('payuTxnid').value = txnid;
                document.getElementById('payuAmount').value = orderData.total;
                document.getElementById('payuProductinfo').value = productinfo;
                document.getElementById('payuFirstname').value = firstname;
                document.getElementById('payuEmail').value = email;
                document.getElementById('payuPhone').value = phone;
                document.getElementById('payuSurl').value = surl;
                document.getElementById('payuFurl').value = furl;
                document.getElementById('payuHash').value = data.hash;
                document.getElementById('payuUdf1').value = orderData.userId || 'guest';

                document.getElementById('payuForm').submit();
            } else {
                alert('Error: Payment initialization failed');
                btn.innerHTML = '<i class="fas fa-shield-alt"></i> Pay Now via PayU';
                btn.disabled = false;
            }
        } catch (error) {
            alert('Error connecting to payment gateway');
            btn.innerHTML = '<i class="fas fa-shield-alt"></i> Pay Now via PayU';
            btn.disabled = false;
        }
    }

    function showSuccess() {
        document.getElementById('successPopup').classList.add('show');
        saveOrder();
        var count = 5;
        var el = document.getElementById('countdown');
        var interval = setInterval(function() {
            count--;
            el.textContent = count;
            if (count <= 0) {
                clearInterval(interval);
                localStorage.removeItem('pendingOrder');
                window.location.href = '/';
            }
        }, 1000);
    }

    function saveOrder() {
        if (!orderData) return;
        try {
            db.collection('orders').add({
                userId: orderData.userId || 'guest',
                userName: orderData.userName || 'Guest',
                userEmail: orderData.userEmail || '',
                items: orderData.items,
                total: orderData.total,
                status: 'confirmed',
                paymentMethod: 'PayU',
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
        } catch(e) {}
    }

    function retryPayment() {
        document.getElementById('failedPopup').classList.remove('show');
        document.getElementById('payBtn').innerHTML = '<i class="fas fa-shield-alt"></i> Pay Now via PayU';
        document.getElementById('payBtn').disabled = false;
    }

    function goBack() {
        window.location.href = '/';
    }
</script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
</body>
</html>
